# Verificación mínima en cada PR: que las dos piezas compilen.
#
# No corre pruebas todavía porque el proyecto aún no tiene infraestructura
# de tests (jest no está instalado). Cuando se agregue, este es el lugar.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proyecto: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.proyecto }}/package-lock.json

      - name: Instalar dependencias
        working-directory: ${{ matrix.proyecto }}
        run: npm ci

      - name: Compilar
        working-directory: ${{ matrix.proyecto }}
        run: npm run build
