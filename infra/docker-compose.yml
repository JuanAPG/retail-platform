# Entorno de desarrollo local de la Plataforma de Análisis de Ingreso
# y Patrones de Consumo Minorista.
#
# Cumple dos propósitos:
#   1. Documentar la estructura del sistema: qué piezas lo componen.
#   2. Levantar un entorno reproducible con un solo comando.
#
# Estado actual: `postgres` y `redis` los usan todos los microservicios
# (Redis lo consulta el SessionGuard en cada petición protegida) y `mongodb`
# lo usan documents-service y notifications-service vía `MONGO_URL`.
# Un servicio arrastra sus dependencias duras con `depends_on`, así que
# basta nombrarlo:
#   docker compose -f infra/docker-compose.yml up -d core-process-service

name: retail-platform

services:
  # ---------------------------------------------------------------
  # Base de datos principal (en uso)
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: retail_postgres
    environment:
      POSTGRES_DB: retaildb
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # El schema y los datos de prueba se aplican solos la PRIMERA vez
      # que se crea el volumen. Van numerados porque Postgres ejecuta
      # estos archivos en orden alfabético: sin el prefijo, data_retail
      # correría antes que el schema y fallaría por tablas inexistentes.
      - "../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro"
      - "../db/data_retail.sql:/docker-entrypoint-initdb.d/02-data.sql:ro"
    healthcheck:
      # Permite que `api` espere a que Postgres acepte conexiones de
      # verdad, no solo a que el contenedor exista.
      test: ["CMD-SHELL", "pg_isready -U retail_user -d retaildb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - retail_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: retail_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@retail.com
      PGADMIN_DEFAULT_PASSWORD: admin_pass_2026
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - retail_net

  # ---------------------------------------------------------------
  # Backend NestJS — monolito modular (en uso)
  # ---------------------------------------------------------------
  api:
    image: node:20
    container_name: retail_api
    working_dir: /app
    volumes:
      - ../api:/app
      # Volumen anónimo: impide que el node_modules del host tape al del
      # contenedor. Sin esto, bcrypt (módulo nativo compilado para el SO
      # del host) truena al arrancar dentro de Linux.
      - /app/node_modules
    environment:
      PORT: 3001
      # `postgres` es el nombre del servicio; dentro de la red de Compose
      # eso resuelve al contenedor. `localhost` apuntaría al propio api.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: retail_user
      DB_PASSWORD: retail_pass_2026
      DB_NAME: retaildb
      # Secretos de desarrollo. En la VM de GCP deben ser otros y venir
      # de un .env que no se versione (openssl rand -base64 48).
      JWT_ACCESS_SECRET: dev_access_secret_solo_para_local
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: dev_refresh_secret_solo_para_local
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 12
    ports:
      - "3001:3001"
    # Se usa la imagen oficial de node en vez de api/Dockerfile
    # a propósito: aquí interesa el modo desarrollo con recarga en
    # caliente. El Dockerfile es para construir la imagen de despliegue.
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - retail_net

  # ---------------------------------------------------------------
  # Frontend React/Vite (en uso)
  # ---------------------------------------------------------------
  web:
    image: node:20
    container_name: retail_web
    working_dir: /app
    volumes:
      - ../web:/app
      - /app/node_modules
    environment:
      # Esta URL la resuelve el NAVEGADOR, que corre en tu máquina y no
      # dentro de la red de Compose: por eso es localhost y no
      # http://api:3001, que solo funcionaría entre contenedores.
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - api
    networks:
      - retail_net

  # ---------------------------------------------------------------
  # Microservicios Sprint 2+3 (Juan Angel: transversal + compose)
  # Arrancan de la plantilla (solo /v1/health) hasta que cada frente
  # implemente su servicio en su rama. Puertos 3101-3110: el 3001 sigue
  # siendo del monolito `api` hasta que la migración lo jubile.
  # Levantarlos: docker compose -f infra/docker-compose.yml up -d <servicio>
  # (cada uno arrastra postgres y redis sanos vía depends_on)
  # ---------------------------------------------------------------
  auth-service:
    image: node:20
    container_name: retail_auth_service
    working_dir: /app
    volumes:
      - ../services/auth-service:/app
      # Igual que `api`: impide que el node_modules del host tape al del
      # contenedor (bcrypt compila para otro SO y truena en Linux).
      - /app/node_modules
    environment:
      PORT: 3101
      SERVICE_NAME: auth-service
      SERVICE_VERSION: 1.0.0
      # targetNamespace de su XSD: el XmlInterceptor lo pone como
      # xmlns en la raiz para que el XML valide contra docs/contratos/.
      XML_NAMESPACE: auth/v1
      JWT_ACCESS_SECRET: dev_access_secret_solo_para_local
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: dev_refresh_secret_solo_para_local
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 12
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:3101
      AUDIT_SERVICE_URL: http://audit-service:3110
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: retail_user
      DB_PASSWORD: retail_pass_2026
      DB_NAME: retaildb
    ports:
      - "3101:3101"
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://localhost:3101/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - retail_net

  catalog-service:
    image: node:20
    container_name: retail_catalog_service
    working_dir: /app
    volumes:
      - ../services/catalog-service:/app
      - /app/node_modules
    environment:
      PORT: 3102
      SERVICE_NAME: catalog-service
      SERVICE_VERSION: 1.0.0
      # targetNamespace de su XSD: el XmlInterceptor lo pone como
      # xmlns en la raiz para que el XML valide contra docs/contratos/.
      XML_NAMESPACE: catalog/v1
      # Auditoría (CAT-08) y notificaciones del alta de producto (CAT-09): no bloqueantes.
      AUDIT_SERVICE_URL: http://audit-service:3110
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:3109
      JWT_ACCESS_SECRET: dev_access_secret_solo_para_local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:3101
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: retail_user
      DB_PASSWORD: retail_pass_2026
      DB_NAME: retaildb
    ports:
      - "3102:3102"
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://localhost:3102/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - retail_net

  pricing-service:
    image: node:20
    container_name: retail_pricing_service
    working_dir: /app
    volumes:
      - ../services/pricing-service:/app
      - /app/node_modules
    environment:
      PORT: 3103
      SERVICE_NAME: pricing-service
      SERVICE_VERSION: 1.0.0
      # targetNamespace de su XSD: el XmlInterceptor lo pone como
      # xmlns en la raiz para que el XML valide contra docs/contratos/.
      XML_NAMESPACE: pricing/v1
      JWT_ACCESS_SECRET: dev_access_secret_solo_para_local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:3101
      AUDIT_SERVICE_URL: http://audit-service:3110
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: retail_user
      DB_PASSWORD: retail_pass_2026
      DB_NAME: retaildb
    ports:
      - "3103:3103"
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://localhost:3103/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - retail_net

  core-process-service:
    image: node:20
    container_name: retail_core_process_service
    working_dir: /app
    volumes:
      - ../services/core-process-service:/app
      - /app/node_modules
    environment:
      PORT: 3104
      SERVICE_NAME: core-process-service
      SERVICE_VERSION: 1.0.0
      JWT_ACCESS_SECRET: dev_access_secret_solo_para_local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:3101
      CATALOG_SERVICE_URL: http://catalog-service:3102
      AUDIT_SERVICE_URL: http://audit-service:3110
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: retail_user
      DB_PASSWORD: retail_pass_2026
      DB_NAME: retaildb
    ports:
      - "3104:3104"
    command: sh -c "npm install && npm run start:dev"
    # Postgres es dependencia DURA: TypeORM conecta en el arranque, así que
    # sin la base el proceso muere al boot. catalog y audit son llamadas en
    # caliente (catálogo caído -> 503 controlado; auditoría -> best-effort),
    # por eso no se declaran aquí.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://localhost:3104/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - retail_net

  algorithms-core:
    image: node:20
    container_name: retail_algorithms_core
    working_dir: /app
    volumes:
      - ../services/algorithms-core:/app
      - /app/node_modules
    environment:
      PORT: 3105
      SERVICE_NAME: algorithms-core
      SERVICE_VERSION: 1.0.0
      # targetNamespace de su XSD: el XmlInterceptor lo pone como
      # xmlns en la raiz para que el XML valide contra docs/contratos/.
      XML_NAMESPACE: algorithms/v1
      JWT_ACCESS_SECRET: dev_access_secret_solo_para_local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:3101
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: retail_user
      DB_PASSWORD: retail_pass_2026
      DB_NAME: retaildb
    ports:
      - "3105:3105"
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://localhost:3105/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - retail_net

  analytics-stats:
    image: python:3.12
    container_name: retail_analytics_stats
    working_dir: /app
    volumes:
      - ../services/analytics-stats:/app
    environment:
      PORT: 3106
      SERVICE_NAME: analytics-stats
      SERVICE_VERSION: 1.0.0
      JWT_ACCESS_SECRET: dev_access_secret_solo_para_local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:3101
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: retail_user
      DB_PASSWORD: retail_pass_2026
      DB_NAME: retaildb
    ports:
      - "3106:3106"
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 3106 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3106/v1/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - retail_net

  decision-service:
    image: node:20
    container_name: retail_decision_service
    working_dir: /app
    volumes:
      - ../services/decision-service:/app
      - /app/node_modules
    environment:
      PORT: 3107
      SERVICE_NAME: decision-service
      SERVICE_VERSION: 1.0.0
      # targetNamespace de su XSD: el XmlInterceptor lo pone como
      # xmlns en la raiz para que el XML valide contra docs/contratos/.
      XML_NAMESPACE: decision/v1
      JWT_ACCESS_SECRET: dev_access_secret_solo_para_local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:3101
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: retail_user
      DB_PASSWORD: retail_pass_2026
      DB_NAME: retaildb
    ports:
      - "3107:3107"
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://localhost:3107/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - retail_net

  documents-service:
    image: node:20
    container_name: retail_documents_service
    working_dir: /app
    volumes:
      - ../services/documents-service:/app
      - /app/node_modules
    environment:
      PORT: 3108
      SERVICE_NAME: documents-service
      SERVICE_VERSION: 1.0.0
      # Mongo con operacion real: historial de reportes
      # (documents-service) y notificaciones (notifications-service).
      # `authSource=admin` porque el usuario se crea en la base admin.
      MONGO_URL: mongodb://retail_admin:retail_pass_2026@mongodb:27017/retaildb?authSource=admin
      JWT_ACCESS_SECRET: dev_access_secret_solo_para_local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:3101
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: retail_user
      DB_PASSWORD: retail_pass_2026
      DB_NAME: retaildb
    ports:
      - "3108:3108"
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://localhost:3108/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - retail_net

  notifications-service:
    image: node:20
    container_name: retail_notifications_service
    working_dir: /app
    volumes:
      - ../services/notifications-service:/app
      - /app/node_modules
    environment:
      PORT: 3109
      SERVICE_NAME: notifications-service
      SERVICE_VERSION: 1.0.0
      # Mongo con operacion real: historial de reportes
      # (documents-service) y notificaciones (notifications-service).
      # `authSource=admin` porque el usuario se crea en la base admin.
      MONGO_URL: mongodb://retail_admin:retail_pass_2026@mongodb:27017/retaildb?authSource=admin
      # targetNamespace de su XSD: el XmlInterceptor lo pone como
      # xmlns en la raiz para que el XML valide contra docs/contratos/.
      XML_NAMESPACE: notif/v1
      JWT_ACCESS_SECRET: dev_access_secret_solo_para_local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:3101
      AUDIT_SERVICE_URL: http://audit-service:3110
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: retail_user
      DB_PASSWORD: retail_pass_2026
      DB_NAME: retaildb
    ports:
      - "3109:3109"
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://localhost:3109/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - retail_net

  audit-service:
    image: node:20
    container_name: retail_audit_service
    working_dir: /app
    volumes:
      - ../services/audit-service:/app
      - /app/node_modules
    environment:
      PORT: 3110
      SERVICE_NAME: audit-service
      SERVICE_VERSION: 1.0.0
      # targetNamespace de su XSD: el XmlInterceptor lo pone como
      # xmlns en la raiz para que el XML valide contra docs/contratos/.
      XML_NAMESPACE: audit/v1
      JWT_ACCESS_SECRET: dev_access_secret_solo_para_local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:3101
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: retail_user
      DB_PASSWORD: retail_pass_2026
      DB_NAME: retaildb
    ports:
      - "3110:3110"
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://localhost:3110/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - retail_net

  # ---------------------------------------------------------------
  # Declarados para el Parcial 2 — todavía sin código que los use
  # ---------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: retail_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: retail_admin
      MONGO_INITDB_ROOT_PASSWORD: retail_pass_2026
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - retail_net

  mongo-express:
    image: mongo-express:1.0.2
    container_name: retail_mongo_express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://retail_admin:retail_pass_2026@mongodb:27017/
      ME_CONFIG_MONGODB_ADMINUSERNAME: retail_admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: retail_pass_2026
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin_pass_2026
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    # mongo-express suele arrancar antes de que Mongo acepte conexiones
    # y se cae; con esto se reintenta solo.
    restart: unless-stopped
    networks:
      - retail_net

  redis:
    image: redis:7
    container_name: retail_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # Los 10 microservicios esperan a Redis sano antes de arrancar:
      # el guard de sesión lo consulta en cada request autenticado.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - retail_net

volumes:
  postgres_data:
  pgadmin_data:
  mongo_data:
  redis_data:

networks:
  retail_net:
    driver: bridge
